//	Description: Look settings for the post process chain and deferred
//	lighting. Distances are in world units (view space).
****************************************************************************/
import 'nanopb.proto';

package usg;

message ToneMapSettings
{
	required float fExposure = 1 [default = 1.0];		// Linear scale applied before the tone curve
	required float fSaturation = 2 [default = 1.0];
	required float fContrast = 3 [default = 1.0];		// Applied around mid grey after the tone curve
	required float fVignette = 4 [default = 0.0];		// 0 = off, 1 = corners fully dark
	required float fLUTStrength = 5 [default = 1.0];
	// Colour grading LUT: a 256x16 strip of 16 16x16 slices (red across, green
	// down, blue by slice), applied in display (sRGB) space. Empty = no LUT.
	required string lutName = 6 [(nanopb).max_size = 64];
	// White balance: a linear gain per channel before the tone curve (a warm grade).
	required float fWhiteR = 7 [default = 1.0];
	required float fWhiteG = 8 [default = 1.0];
	required float fWhiteB = 9 [default = 1.0];
	// Aerial perspective: the scene fades towards the haze colour (linear HDR, like the
	// lighting) with horizontal distance from the camera beyond fHazeStart, at fHazeDensity
	// per world unit, up to fHazeMax; thinning with height above fHazeBase at fHazeFalloff
	// per unit (0 = the same at every height). fHazeDensity 0 turns it off. Horizontal
	// distance, so a camera looking straight down sees no haze over what it frames.
	required float fHazeDensity = 10 [default = 0.0];
	required float fHazeStart = 11 [default = 0.0];
	required float fHazeMax = 12 [default = 1.0];
	required float fHazeR = 13 [default = 1.0];
	required float fHazeG = 14 [default = 1.0];
	required float fHazeB = 15 [default = 1.0];
	required float fHazeBase = 16 [default = 0.0];
	required float fHazeFalloff = 17 [default = 0.0];
}

message LightingSettings
{
	required float fIBLIntensity = 1 [default = 1.0];
	required float fAmbientScale = 2 [default = 1.0];		// Scales the scene's flat ambient light
	required float fHorizonFade = 3 [default = 1.3];		// Fades reflections that point below the surface
	// Environment for image based lighting; empty = the engine's default studio
	required string envRadianceName = 4 [(nanopb).max_size = 64];
	required string envIrradianceName = 5 [(nanopb).max_size = 64];
	required float fEnvRotation = 6 [default = 0.0];		// Yaw of the environment, radians

	// Screen space contact shadows for the primary shadowed directional light
	required float fContactShadowLength = 7 [default = 0.0];	// 0 disables
	required float fContactShadowThickness = 8 [default = 0.05];
	required uint32 uContactShadowSteps = 9 [default = 8];
	required float fContactShadowStrength = 10 [default = 1.0];
	// Moves the shadow lookup along the surface normal (world units) to
	// remove acne on surfaces at a grazing angle to the light
	required float fShadowNormalOffset = 11 [default = 0.0];

	// Screen space reflections in the image based lighting: a ray march through
	// the depth buffer that reads last frame's lit scene (the bloom's quarter
	// resolution copy, reprojected) where it hits. Replaces the environment in
	// clearcoat and smooth specular reflections. uSSRSteps is the quality knob
	// (0 disables); needs bloom.
	required uint32 uSSRSteps = 12 [default = 0];
	required float fSSRDistance = 13 [default = 12.0];		// Ray length, view units
	required float fSSRThickness = 14 [default = 0.6];		// Depth a hit may be behind the surface, view units
	required float fSSRMaxRoughness = 15 [default = 0.55];	// Rougher specular keeps the environment

	// Hemisphere ambient: sky light from above and light bounced off the ground
	// from below, blended by the world space normal and added to the image based
	// diffuse (linear HDR, not scaled by fIBLIntensity). Black (the default) is off.
	required float fSkyR = 16 [default = 0.0];
	required float fSkyG = 17 [default = 0.0];
	required float fSkyB = 18 [default = 0.0];
	required float fGroundR = 19 [default = 0.0];
	required float fGroundG = 20 [default = 0.0];
	required float fGroundB = 21 [default = 0.0];
	// Share of the environment reflection replaced by that sky and ground
	// gradient, so water and glossy surfaces pick up the same sky (0 = off)
	required float fSkyReflection = 22 [default = 0.0];
	// The primary shadowed directional light's diffuse in its own shadow and past
	// its terminator: the share of the light that still arrives there, per channel
	// (scattered sky and bounce light; 0 = black, Lambert). fLightWrap carries it
	// round the form: (N.L + wrap) / (1 + wrap) instead of N.L.
	required float fShadowTintR = 23 [default = 0.0];
	required float fShadowTintG = 24 [default = 0.0];
	required float fShadowTintB = 25 [default = 0.0];
	required float fLightWrap = 26 [default = 0.0];
}

message BloomSettings
{
	required float fThreshold = 1 [default = 0.9];		// Linear scene luminance where bloom starts
	required float fScale = 2 [default = 1.0];
}

message SSAOSettings
{
	required float fRadius = 1 [default = 1.2];			// World units
	required float fStrength = 2 [default = 1.0];
	required float fPower = 3 [default = 1.5];
	required float fFadeOutFrom = 4 [default = 50.0];		// View distance where AO starts to fade
	required float fFadeOutTo = 5 [default = 300.0];
	// Share of the occlusion that also darkens the primary directional light
	// (contact darkening in sunlit corners; 0 = ambient only)
	required float fDirectStrength = 6 [default = 0.0];
}

message TiltShiftSettings
{
	required float fFocusCenter = 1 [default = 0.5];		// Screen height fraction, 0 = top
	required float fFocusHalfHeight = 2 [default = 0.18];	// Sharp band half height, screen fraction
	required float fTransition = 3 [default = 0.3];		// Distance over which the blur ramps to full
	required float fMaxRadius = 4 [default = 6.0];		// Blur radius in pixels at 1080 lines
}

message PostFXSettings
{
	required ToneMapSettings toneMap = 1;
	required LightingSettings lighting = 2;
	required BloomSettings bloom = 3;
	required SSAOSettings ssao = 4;
	required TiltShiftSettings tiltShift = 5;
}
